version: "3.8"

services:
  # ─── PostgreSQL Database ───────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-check_it}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis Cache ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── FastAPI Backend + Scraper ────────────────────────────
  backend:
    build:
      context: .
      dockerfile: back-end/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database (async driver for SQLAlchemy)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-check_it}
      DB_ECHO: ${DB_ECHO:-false}
      # JWT (required, no default: set SECRET_KEY in .env)
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is not set, add it to .env}
      # Gemini API for LLM product validation (legacy fallback)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Anthropic Claude (primary LLM)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4.5}
      ANTHROPIC_MODEL_SMART: ${ANTHROPIC_MODEL_SMART:-claude-sonnet-4.6}
      # Redis cache
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-7200}
    ports:
      - "8000:8000"

  # ─── Vue 3 Frontend (nginx) ──────────────────────────────
  frontend:
    build:
      context: ./front-project
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
